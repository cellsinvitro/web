services:
  - type: web
    name: cellsinvitro-api
    runtime: node
    buildCommand: npm install && npm run build --workspace=server && cd apps/server && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://www.cellsinvitro.com
      - key: GOOGLE_REDIRECT_URI
        value: https://www.cellsinvitro.com/api/auth/google/callback
      # Email — set BREVO_API_KEY in Render dashboard (must be an xkeysib- REST API key)
      # Generate at: app.brevo.com → SMTP & API → API Keys
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "CellsInVitro <cellsinvitro.w@gmail.com>"
