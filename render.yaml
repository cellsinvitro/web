services:
  - type: web
    name: cellsinvitro-api
    runtime: node
    buildCommand: npm install && npm run build --workspace=server
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://cellsinvitro.vercel.app
      - key: GOOGLE_REDIRECT_URI
        value: https://cellsinvitro.vercel.app/api/auth/google/callback
